# Clone agritech-backend next to this repo, then: docker compose up -d --build
# Only `web` publishes a port; `backend` is reachable from `web` alone.
services:
  web:
    build: .
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
  backend:
    build: ../agritech-backend
    environment:
      SERVER_PATH: /api
      PORT: 3000
    expose:
      - "3000"
    restart: unless-stopped
